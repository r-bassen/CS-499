<div class="container mt-4">
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
      <span class="navbar-brand">Admin Panel</span>
      <div class="navbar-nav">
        <a class="nav-link" [routerLink]="['']">Trips</a>
        <a class="nav-link active" [routerLink]="['/users']">Users</a>
        <a class="nav-link" [routerLink]="['/reservations']">Reservations</a>
        <a class="nav-link" (click)="logout()" style="cursor: pointer;">Logout</a>
      </div>
    </div>
  </nav>

  <h2>Users</h2>
  <button (click)="createUser()" class="btn btn-info">Add User</button>


  <!-- Error Message -->
  <div *ngIf="usersError" class="alert alert-danger">
    {{ usersError }}
  </div>

  <!-- Users Table -->
  <div class="card">
    <div class="card-body">
      <table class="table table-striped" *ngIf="users.length > 0">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>
              <button class="btn btn-sm btn-danger" (click)="deleteUser(user._id!)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="users.length === 0 && !usersError" class="alert alert-info">
        No users found.
      </div>
    </div>
  </div>
</div>
